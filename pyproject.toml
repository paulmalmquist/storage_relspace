[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "strongbox"
version = "0.1.0"
description = "CUI-grade blob and structured data store: envelope encryption, a REST API for services, and an MCP server for agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Paul Malmquist" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "jsonschema>=4.22",
  "httpx>=0.27",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-kms>=3.0",
  "google-cloud-storage>=2.18",
  "google-crc32c>=1.5",
  "google-auth>=2.30",
]
s3 = ["boto3>=1.34"]
mcp = ["mcp>=2.3,<3"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "google-crc32c>=1.5",
  "mcp>=2.3,<3",
]

[project.scripts]
strongbox = "strongbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strongbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["postgres: runs only when STRONGBOX_TEST_DATABASE_URL points at Postgres"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "PT"]
ignore = [
  "S101",   # asserts are fine in tests
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "PT011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["strongbox"]

[[tool.mypy.overrides]]
module = ["google.*", "boto3.*", "botocore.*", "jsonschema.*", "google_crc32c.*"]
ignore_missing_imports = true
