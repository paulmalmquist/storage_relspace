name: strongbox-dreamcatcher-demo
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: strongbox_demo
    volumes:
      - demo-db:/var/lib/postgresql/data
      - ../../infra/compose/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d strongbox_demo"]
      interval: 2s
      retries: 30
  gallery:
    build:
      context: ../..
      dockerfile: examples/dreamcatcher/lab/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRONGBOX_ENV: dev
      STRONGBOX_APP_ENV: dev
      STRONGBOX_DATABASE_URL: postgres://strongbox_api:strongbox-api@postgres:5432/strongbox_demo?sslmode=disable
      STRONGBOX_MIGRATION_DATABASE_URL: postgres://postgres:local-demo-only@postgres:5432/strongbox_demo?sslmode=disable
    ports: ["127.0.0.1:18401:18401","127.0.0.1:18402:18402"]
    volumes: ["demo-state:/state"]
volumes:
  demo-db:
  demo-state:
