[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "strongbox-client"
version = "0.2.0"
description = "Async Python client for the Strongbox API (for Python services, Spark/Airflow jobs, notebooks)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
gcp = ["google-auth>=2.30", "requests>=2.31", "pyjwt>=2.9"]

[tool.hatch.build.targets.wheel]
packages = ["strongbox_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
