# Local development stack: Postgres + API + MCP (streamable HTTP). Not for CUI.
#   docker compose up --build
#   docker compose exec api strongbox principal put you@example.com --scope '*' --us-person --cui-access --category '*'
#   docker compose exec api strongbox token you@example.com
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: strongbox
      POSTGRES_DB: strongbox
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment: &env
      STRONGBOX_ENV: dev
      STRONGBOX_DATABASE_URL: postgresql+psycopg://postgres:strongbox@postgres:5432/strongbox
      STRONGBOX_DEV_JWT_SECRET: ${STRONGBOX_DEV_JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      STRONGBOX_LOCAL_KEYRING_PATH: /data/keyring.json
      STRONGBOX_BLOB_LOCAL_PATH: /data/blobs
    command: ["sh", "-c", "strongbox init && strongbox serve --port 8080"]
    entrypoint: []
    volumes: ["strongbox-data:/data"]
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build: .
    environment:
      <<: *env
      STRONGBOX_MCP_API_URL: http://api:8080
      STRONGBOX_MCP_PUBLIC_URL: http://localhost:8090
      STRONGBOX_MCP_TOKEN: ${STRONGBOX_MCP_TOKEN:-}
      STRONGBOX_DELEGATION_AUDIENCES: '["strongbox"]'
    command: ["mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8090"]
    ports: ["8090:8090"]
    depends_on: [api]

volumes:
  strongbox-data:
