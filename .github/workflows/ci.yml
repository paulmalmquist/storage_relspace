name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: strongbox
          POSTGRES_DB: strongbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,gcp,s3,mcp]"
      - name: Lint
        run: |
          ruff format --check src tests
          ruff check src tests
      - name: Type check
        run: mypy
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres)
        env:
          STRONGBOX_TEST_DATABASE_URL: postgresql+psycopg://postgres:strongbox@localhost:5432/strongbox_test
        run: pytest -q
      - name: Static security analysis
        run: bandit -q -r src
      - name: Dependency vulnerabilities
        run: pip-audit

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t strongbox:ci .
      - run: docker run --rm strongbox:ci --help
