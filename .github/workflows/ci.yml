name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  STRONGBOX_TEST_DATABASE_URL: postgres://postgres:strongbox@localhost:5432/strongbox_test?sslmode=disable
  # Integration tests fail (instead of skipping) when Postgres is unavailable.
  STRONGBOX_REQUIRE_INTEGRATION: "1"

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: strongbox
          POSTGRES_DB: strongbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Tests (race detector, Postgres)
        run: go test -race -count=1 ./...
      - name: Tests in enforced FIPS 140-3 mode
        run: GOFIPS140=v1.0.0 GODEBUG=fips140=only go test -count=1 ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: No first-party Python
        run: |
          if git ls-files | grep -E '\.py$|(^|/)(pyproject\.toml|setup\.py|setup\.cfg|requirements[^/]*\.txt|Pipfile|poetry\.lock)$'; then
            echo "Python files or manifests found"; exit 1
          fi

  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: strongbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Types match internal/api/openapi.json
        run: npm run check-generated
      - run: npm run typecheck
      - run: npm run build
      - name: Unit and contract tests against a live server (restricted login, real Postgres)
        run: |
          PG_ADMIN_URL=postgres://postgres:strongbox@localhost:5432/postgres?sslmode=disable scripts/live-server.sh > .live.env
          . ./.live.env
          npm test
          npm run example

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t strongbox:ci .
      - run: docker run --rm strongbox:ci version
      - name: FIPS 140-3 module active in the image
        run: docker run --rm strongbox:ci fips-check
